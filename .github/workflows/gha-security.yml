name: GitHub Actions security

on:
  workflow_call:
    inputs:
      run-actionlint:
        description: Run actionlint against workflow files.
        type: boolean
        required: false
        default: true
      run-action-pins:
        description: Enforce Backblaze's full-SHA action pin policy.
        type: boolean
        required: false
        default: true
      run-zizmor:
        description: Run zizmor static analysis.
        type: boolean
        required: false
        default: true
      zizmor-persona:
        description: "zizmor persona: regular, pedantic, or auditor."
        type: string
        required: false
        default: pedantic
      zizmor-online-audits:
        description: Allow zizmor to use the GitHub API for online audits.
        type: boolean
        required: false
        default: false
      zizmor-version:
        description: Exact zizmor version passed to zizmor-action.
        type: string
        required: false
        default: "1.25.2"

permissions:
  contents: read
  actions: read

jobs:
  gha-security:
    name: GitHub Actions security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run actionlint
        if: ${{ inputs.run-actionlint }}
        shell: bash
        run: |
          set -euo pipefail

          ACTIONLINT_VERSION="1.7.12"

          binary_sha_for() {
            case "$1" in
              darwin_amd64)  echo "d1f7cee75ae2873609bd9567b4600bebc5315a5e733e73202987a44fafdd53b2" ;;
              darwin_arm64)  echo "8db11704dc296f096216db4db65d86cd7f0ebfdf4c38453a1da276b137b88388" ;;
              linux_amd64)   echo "c872d6db8c6bf83a8eaa704fc93999f027d55dffbc63b8a6abdccb47df5f4cd4" ;;
              linux_arm64)   echo "ac0323433c2853ec3fb978c611430c5b3dc5d43c58d1a1ec031b00ab572beb60" ;;
              windows_amd64) echo "54ca21be3de4c7cfa26914aa8b61bd76bf573ef3caac5f80d110558cdf241718" ;;
              *) echo "" ;;
            esac
          }

          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1" | awk '{print $1}'
            else
              echo "need sha256sum or shasum to verify actionlint" >&2
              exit 1
            fi
          }

          os="$(uname -s)"
          arch="$(uname -m)"
          case "$os" in
            Linux) os=linux ;;
            Darwin) os=darwin ;;
            MINGW* | MSYS* | CYGWIN* | Windows_NT) os=windows ;;
            *) echo "unsupported OS '$os'" >&2; exit 1 ;;
          esac
          case "$arch" in
            x86_64 | amd64) arch=amd64 ;;
            arm64 | aarch64) arch=arm64 ;;
            *) echo "unsupported arch '$arch'" >&2; exit 1 ;;
          esac

          exe=""
          [ "$os" = windows ] && exe=".exe"
          key="${os}_${arch}"
          want="$(binary_sha_for "$key")"
          [ -n "$want" ] || { echo "no pinned actionlint checksum for ${key}" >&2; exit 1; }

          cache_root="${RUNNER_TEMP:-$PWD/.cache}/backblaze-actionlint"
          bin="$cache_root/actionlint-${ACTIONLINT_VERSION}${exe}"

          if [ ! -x "$bin" ] || [ "$(sha256_of "$bin")" != "$want" ]; then
            mkdir -p "$cache_root"
            ext="tar.gz"
            [ "$os" = windows ] && ext="zip"
            url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_${key}.${ext}"
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            echo "downloading actionlint v${ACTIONLINT_VERSION} (${key})"
            curl -fsSL -o "$tmp/asset" "$url"
            if [ "$ext" = zip ]; then
              unzip -o -q "$tmp/asset" -d "$tmp"
            else
              tar -xzf "$tmp/asset" -C "$tmp"
            fi
            cp "$tmp/actionlint${exe}" "$bin"
            chmod 0755 "$bin"
          fi

          got="$(sha256_of "$bin")"
          if [ "$got" != "$want" ]; then
            echo "actionlint checksum mismatch for ${key}" >&2
            echo "  expected: $want" >&2
            echo "  actual:   $got" >&2
            exit 1
          fi

          "$bin" -color

      - name: Check GitHub Actions pins
        if: ${{ inputs.run-action-pins }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { existsSync, readdirSync, readFileSync, statSync } from 'node:fs'
          import { join, relative, resolve } from 'node:path'

          const root = resolve('.')
          const scanDirs = ['.github/workflows', '.github/actions', 'actions']
          const fullSha = /^[0-9a-f]{40}$/
          const exactVersion = /\bv\d+\.\d+\.\d+\b/

          function collectYaml(dir) {
            if (!existsSync(dir)) return []
            const out = []
            for (const entry of readdirSync(dir)) {
              const full = join(dir, entry)
              if (statSync(full).isDirectory()) out.push(...collectYaml(full))
              else if (/\.ya?ml$/.test(entry)) out.push(full)
            }
            return out
          }

          function stripInlineComment(line) {
            let quote = null
            for (let i = 0; i < line.length; i += 1) {
              const char = line[i]
              if ((char === '"' || char === "'") && line[i - 1] !== '\\') {
                quote = quote === char ? null : quote || char
              }
              if (char === '#' && quote === null) return line.slice(0, i)
            }
            return line
          }

          function usesRefFromLine(line) {
            const match = stripInlineComment(line).match(/^\s*-?\s*uses:\s*['"]?([^'"\s]+)/)
            return match ? match[1] : null
          }

          const violations = []
          for (const rel of scanDirs) {
            for (const file of collectYaml(join(root, rel))) {
              readFileSync(file, 'utf8').split('\n').forEach((line, index) => {
                const ref = usesRefFromLine(line)
                if (!ref || ref.startsWith('./') || ref.startsWith('../') || ref.startsWith('docker://') || !ref.includes('@')) return
                const pin = ref.slice(ref.lastIndexOf('@') + 1)
                const where = `${relative(root, file)}:${index + 1}`
                if (!fullSha.test(pin)) {
                  violations.push(`${where} ${ref} ref "${pin}" is not a full 40-character commit SHA`)
                  return
                }
                const commentIndex = line.indexOf('#')
                const comment = commentIndex === -1 ? '' : line.slice(commentIndex + 1)
                if (!exactVersion.test(comment)) {
                  violations.push(`${where} ${ref} missing exact-version comment (expected # vX.Y.Z)`)
                }
              })
            }
          }

          if (violations.length > 0) {
            console.error('Action pinning violation(s):')
            for (const violation of violations) console.error(`  ${violation}`)
            process.exit(1)
          }

          console.log('All scanned GitHub Actions references are SHA-pinned with exact-version comments.')
          NODE

      - name: Run zizmor
        if: ${{ inputs.run-zizmor }}
        uses: zizmorcore/zizmor-action@0dce2577a4760a2749d8cfb7a84b7d5585ebcb7d # v0.5.0
        with:
          advanced-security: false
          annotations: true
          online-audits: ${{ inputs.zizmor-online-audits }}
          persona: ${{ inputs.zizmor-persona }}
          version: ${{ inputs.zizmor-version }}
