name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # needed to check out and audit repository workflow files

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-static-checks
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Shell syntax
        shell: bash
        run: bash -n scripts/actionlint.sh

      - name: Node syntax
        shell: bash
        run: node --check scripts/check-action-pins.mjs

      - name: Check GitHub Actions pins
        shell: bash
        run: node scripts/check-action-pins.mjs --root .

      - name: actionlint
        shell: bash
        run: bash scripts/actionlint.sh

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-zizmor
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: false
          annotations: true
          online-audits: false
          persona: pedantic
          version: 1.22.0
