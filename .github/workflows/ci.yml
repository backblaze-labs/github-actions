name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # needed to check out and audit repository workflow files

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: static checks
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-static-checks
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell syntax
        shell: bash
        run: bash -n scripts/actionlint.sh

      - name: Node syntax
        shell: bash
        run: node --check scripts/check-action-pins.mjs

      - name: Check GitHub Actions pins
        shell: bash
        run: node scripts/check-action-pins.mjs --root .

      - name: actionlint
        shell: bash
        run: bash scripts/actionlint.sh

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-zizmor
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec zizmor==1.22.0 zizmor --persona=pedantic --format=github --no-online-audits --color=always -- .
