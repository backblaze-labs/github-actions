name: Backblaze actionlint
description: Run a pinned, checksum-verified actionlint binary.

inputs:
  working-directory:
    description: Directory containing the repository to lint.
    required: false
    default: .
  args:
    description: Additional arguments passed to actionlint.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run actionlint
      shell: bash
      env:
        ACTIONLINT_ARGS: ${{ inputs.args }}
        ACTIONLINT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        cd -- "$ACTIONLINT_WORKING_DIRECTORY"
        actionlint_args=()
        if [ -n "$ACTIONLINT_ARGS" ]; then
          read -r -a actionlint_args <<< "$ACTIONLINT_ARGS"
        fi
        bash "${GITHUB_ACTION_PATH}/../../scripts/actionlint.sh" "${actionlint_args[@]}"
