name: Backblaze actionlint
description: Run a pinned, checksum-verified actionlint binary.

inputs:
  working-directory:
    description: Directory containing the repository to lint.
    required: false
    default: .
  args:
    description: Additional arguments passed to actionlint.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run actionlint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        bash "${GITHUB_ACTION_PATH}/../../scripts/actionlint.sh" ${{ inputs.args }}

