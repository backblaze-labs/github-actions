name: Backblaze GitHub Actions security checks
description: Run Backblaze's language-agnostic GitHub Actions security checks.

inputs:
  working-directory:
    description: Directory containing the checked-out caller repository to scan.
    required: false
    default: .
  actionlint:
    description: Run actionlint.
    required: false
    default: "true"
  action-pins:
    description: Enforce full-SHA action pins with exact version comments.
    required: false
    default: "true"
  zizmor:
    description: Run zizmor static analysis.
    required: false
    default: "true"
  zizmor-persona:
    description: "zizmor persona: regular, pedantic, or auditor."
    required: false
    default: pedantic
  zizmor-online-audits:
    description: Allow zizmor to use the GitHub API for online audits.
    required: false
    default: "false"
  zizmor-version:
    description: Exact zizmor version to run.
    required: false
    default: "1.22.0"
  zizmor-config:
    description: Optional path to a zizmor config file, relative to the caller repository.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run actionlint
      if: ${{ inputs.actionlint == 'true' }}
      shell: bash
      env:
        GHA_SECURITY_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        cd -- "$GHA_SECURITY_WORKING_DIRECTORY"
        bash "${GITHUB_ACTION_PATH}/../../scripts/actionlint.sh"

    - name: Check GitHub Actions pins
      if: ${{ inputs.action-pins == 'true' }}
      shell: bash
      env:
        GHA_SECURITY_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        node "${GITHUB_ACTION_PATH}/../../scripts/check-action-pins.mjs" --root "$GHA_SECURITY_WORKING_DIRECTORY"

    - name: Run zizmor
      if: ${{ inputs.zizmor == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GHA_SECURITY_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        GHA_SECURITY_ZIZMOR_CONFIG: ${{ inputs.zizmor-config }}
        GHA_SECURITY_ZIZMOR_ONLINE_AUDITS: ${{ inputs.zizmor-online-audits }}
        GHA_SECURITY_ZIZMOR_PERSONA: ${{ inputs.zizmor-persona }}
        GHA_SECURITY_ZIZMOR_VERSION: ${{ inputs.zizmor-version }}
      run: |
        set -euo pipefail
        [[ "$GHA_SECURITY_ZIZMOR_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.dev[0-9]+)?$ ]] \
          || { echo "::error::zizmor-version must be an exact X.Y.Z version"; exit 1; }
        zizmor_dir="${RUNNER_TEMP}/zizmor"
        rm -rf -- "$zizmor_dir"
        python3 -m pip install --quiet --no-input --disable-pip-version-check \
          --only-binary=:all: --no-deps --target "$zizmor_dir" "zizmor==${GHA_SECURITY_ZIZMOR_VERSION#v}"
        args=("--persona=${GHA_SECURITY_ZIZMOR_PERSONA}" --format=github --color=always)
        [[ "$GHA_SECURITY_ZIZMOR_ONLINE_AUDITS" == "true" ]] || args+=(--no-online-audits)
        [[ -z "$GHA_SECURITY_ZIZMOR_CONFIG" ]] || args+=("--config=${GHA_SECURITY_ZIZMOR_CONFIG}")
        cd -- "$GITHUB_WORKSPACE"
        "${zizmor_dir}/bin/zizmor" "${args[@]}" -- "$GHA_SECURITY_WORKING_DIRECTORY"
