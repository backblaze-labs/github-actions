name: Backblaze GitHub Actions security checks
description: Run Backblaze's language-agnostic GitHub Actions security checks.

inputs:
  working-directory:
    description: Directory containing the checked-out caller repository to scan.
    required: false
    default: .
  actionlint:
    description: Run actionlint.
    required: false
    default: "true"
  action-pins:
    description: Enforce full-SHA action pins with exact version comments.
    required: false
    default: "true"
  zizmor:
    description: Run zizmor static analysis.
    required: false
    default: "true"
  zizmor-persona:
    description: "zizmor persona: regular, pedantic, or auditor."
    required: false
    default: pedantic
  zizmor-online-audits:
    description: Allow zizmor to use the GitHub API for online audits.
    required: false
    default: "false"
  zizmor-version:
    description: Exact zizmor version to run.
    required: false
    default: "1.25.2"
  zizmor-config:
    description: Optional path to a zizmor config file, relative to the caller repository.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run actionlint
      if: ${{ inputs.actionlint == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        bash "${GITHUB_ACTION_PATH}/../../scripts/actionlint.sh"

    - name: Check GitHub Actions pins
      if: ${{ inputs.action-pins == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        node "${GITHUB_ACTION_PATH}/../../scripts/check-action-pins.mjs" --root "${{ inputs.working-directory }}"

    - name: Run zizmor
      if: ${{ inputs.zizmor == 'true' }}
      uses: zizmorcore/zizmor-action@0dce2577a4760a2749d8cfb7a84b7d5585ebcb7d # v0.5.0
      with:
        advanced-security: false
        annotations: true
        config: ${{ inputs.zizmor-config }}
        inputs: ${{ inputs.working-directory }}
        online-audits: ${{ inputs.zizmor-online-audits }}
        persona: ${{ inputs.zizmor-persona }}
        version: ${{ inputs.zizmor-version }}
